# Local development stack: Postgres, the FastAPI backend and Airflow.
#
# Run from this folder:
#   docker compose up -d --build     start everything
#   docker compose ps                see what is running
#   docker compose logs -f api       follow a service's logs
#   docker compose down              stop everything (data is kept)
#
# API:       http://localhost:8000/docs
# Airflow:   http://localhost:8080
# Dashboard: http://localhost:8501
# Kafka from your machine: localhost:9094
# Postgres from your machine: localhost:5433 (user/password: postgres)

name: smartcart

services:
  postgres:
    image: postgres:17
    environment:
      # Local-only credentials; the port is reachable from this machine only.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_cart_recovery
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # These run only on first start, while the data volume is empty.
      - ./postgres/00_create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/migrations/003_dashboard_reader.sql:/docker-entrypoint-initdb.d/02_dashboard_reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_cart_recovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # SMTP settings come from the project's .env file.
    env_file:
      - path: ../.env
        required: false
    # These override .env so the API uses the Postgres container.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: smart_cart_recovery
      DB_USER: postgres
      DB_PASSWORD: postgres
      RECOVERY_THRESHOLD_MINUTES: ${RECOVERY_THRESHOLD_MINUTES:-30}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      # Started first, but the API keeps working if Kafka is down.
      kafka:
        condition: service_started

  kafka:
    image: apache/kafka:4.3.1
    environment:
      # One node acting as both broker and controller (KRaft, no ZooKeeper).
      CLUSTER_ID: aNrBgzc3TciiqL488_UqTA
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      # kafka:9092 for containers, localhost:9094 for tools on this machine.
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      # A single broker can only keep one copy of each partition.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Keep events for 7 days; cap memory for a small laptop.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_HEAP_OPTS: -Xms256m -Xmx512m
    ports:
      - "127.0.0.1:9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  abandonment-consumer:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command: ["python", "-m", "streaming.abandonment_consumer"]
    # Talks only to Kafka and the API; no database or email secrets.
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SMART_CART_API_URL: http://api:8000
      RECOVERY_THRESHOLD_MINUTES: ${RECOVERY_THRESHOLD_MINUTES:-30}
    restart: unless-stopped
    depends_on:
      kafka:
        condition: service_healthy
      api:
        condition: service_started

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - streamlit
      - run
      - dashboard/dashboard.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --theme.base=light
      - --theme.primaryColor=#2a78d6
      # Hide Streamlit's developer menu and Deploy button.
      - --client.toolbarMode=viewer
    # Read-only database login; the dashboard needs no other secrets.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: smart_cart_recovery
      DB_USER: dashboard_reader
      DB_PASSWORD: dashboard_reader
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:3.3.2
    # Runs the scheduler, DAG processor and web UI in one container.
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local only: skip the login page.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Shared by Airflow's components to sign task tokens; local-only value.
      AIRFLOW__API_AUTH__JWT_SECRET: smartcart-local-dev-secret
      SMART_CART_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../airflow:/opt/airflow/dags:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
