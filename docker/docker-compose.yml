# Local development stack: Postgres, the FastAPI backend and Airflow.
#
# Run from this folder:
#   docker compose up -d --build     start everything
#   docker compose ps                see what is running
#   docker compose logs -f api       follow a service's logs
#   docker compose down              stop everything (data is kept)
#
# API:       http://localhost:8000/docs
# Airflow:   http://localhost:8080
# Dashboard: http://localhost:8501
# Postgres from your machine: localhost:5433 (user/password: postgres)

name: smartcart

services:
  postgres:
    image: postgres:17
    environment:
      # Local-only credentials; the port is reachable from this machine only.
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: smart_cart_recovery
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # These run only on first start, while the data volume is empty.
      - ./postgres/00_create_airflow_db.sql:/docker-entrypoint-initdb.d/00_create_airflow_db.sql:ro
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ../database/migrations/003_dashboard_reader.sql:/docker-entrypoint-initdb.d/02_dashboard_reader.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smart_cart_recovery"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    # SMTP settings come from the project's .env file.
    env_file:
      - path: ../.env
        required: false
    # These override .env so the API uses the Postgres container.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: smart_cart_recovery
      DB_USER: postgres
      DB_PASSWORD: postgres
      RECOVERY_THRESHOLD_MINUTES: ${RECOVERY_THRESHOLD_MINUTES:-30}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

  dashboard:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    command:
      - streamlit
      - run
      - dashboard/dashboard.py
      - --server.port=8501
      - --server.address=0.0.0.0
      - --server.headless=true
      - --browser.gatherUsageStats=false
      - --theme.base=light
      - --theme.primaryColor=#2a78d6
      # Hide Streamlit's developer menu and Deploy button.
      - --client.toolbarMode=viewer
    # Read-only database login; the dashboard needs no other secrets.
    environment:
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: smart_cart_recovery
      DB_USER: dashboard_reader
      DB_PASSWORD: dashboard_reader
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      postgres:
        condition: service_healthy

  airflow:
    image: apache/airflow:3.3.2
    # Runs the scheduler, DAG processor and web UI in one container.
    command: standalone
    environment:
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://postgres:postgres@postgres:5432/airflow
      AIRFLOW__CORE__EXECUTOR: LocalExecutor
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      # Local only: skip the login page.
      AIRFLOW__CORE__SIMPLE_AUTH_MANAGER_ALL_ADMINS: "true"
      # Shared by Airflow's components to sign task tokens; local-only value.
      AIRFLOW__API_AUTH__JWT_SECRET: smartcart-local-dev-secret
      SMART_CART_API_URL: http://api:8000
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ../airflow:/opt/airflow/dags:ro
    depends_on:
      postgres:
        condition: service_healthy
      api:
        condition: service_started

volumes:
  postgres_data:
